name: Apply HNA mobile and blackout patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_hna_mobile_blackout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_hna_mobile_blackout.py
      - name: Validate JavaScript
        run: node --check static/app.js && node --check public/static/app.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html public/index.html static/style.css public/static/style.css tests/test_calendar_status.py
          git commit -m "Refresh HNA mobile UI and enforce October blackout"
          git rm scripts/apply_hna_mobile_blackout.py .github/workflows/apply-hna-mobile-blackout.yml
          git commit -m "Remove temporary release patch files"
          git push
