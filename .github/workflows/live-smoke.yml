name: Live calendar smoke
on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile function
        run: |
          python -m py_compile 'cloud-functions/api/[[default]].py'
      - name: Check live endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://calendar.lovefly.club'

          curl -fsS -o /tmp/root.html --max-time 30 "$base/"
          grep -q '海航飞飞乐PLUS快速查询' /tmp/root.html

          curl -fsS -o /tmp/meta.json --max-time 60 "$base/api/meta"
          curl -fsS -o /tmp/routes.json --max-time 120 "$base/api/routes?location=%E5%8C%97%E4%BA%AC&direction=departure&membership=666"
          curl -fsS -o /tmp/search.json --max-time 120 "$base/api/search?origin=PEK&destination=CAN&date=2026-09-01&membership=666&max_stops=0"

          python - <<'PY'
          import json
          meta=json.load(open('/tmp/meta.json'))
          routes=json.load(open('/tmp/routes.json'))
          search=json.load(open('/tmp/search.json'))
          required=['date_min','date_max','flight_records','route_count','airport_count','airports','airlines','cities']
          assert all(k in meta for k in required), meta
          assert isinstance(meta['airlines'], list) and meta['airlines'], meta
          assert routes.get('selected_name') == '北京', routes
          assert isinstance(routes.get('routes'), list) and routes['routes'], routes
          assert isinstance(search.get('results'), list), search
          print('meta', meta['flight_records'], meta['route_count'], meta['airport_count'])
          print('beijing_routes', routes['count'])
          print('search_results', search['count'])
          PY
