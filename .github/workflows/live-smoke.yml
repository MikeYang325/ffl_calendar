name: Inspect calendar database schema
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Inspect calendar database schema'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed SQLite schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 120 'https://ffl-calendar-new.edgeone.dev/data/flights.db' -o /tmp/flights.db
          echo '=== FILE ==='
          ls -lh /tmp/flights.db
          echo '=== TABLES ==='
          sqlite3 /tmp/flights.db '.tables'
          echo '=== TABLE DEFINITIONS ==='
          sqlite3 /tmp/flights.db "SELECT name, sql FROM sqlite_master WHERE type='table' ORDER BY name;"
          echo '=== FLIGHTS COLUMNS ==='
          sqlite3 /tmp/flights.db 'PRAGMA table_info(flights);'
          echo '=== ROUTES COLUMNS ==='
          sqlite3 /tmp/flights.db 'PRAGMA table_info(routes);'
          echo '=== SAMPLE FLIGHTS ==='
          sqlite3 -header -column /tmp/flights.db 'SELECT * FROM flights LIMIT 3;'
          echo '=== SAMPLE ROUTES ==='
          sqlite3 -header -column /tmp/flights.db 'SELECT * FROM routes LIMIT 3;'
