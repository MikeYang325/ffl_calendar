name: Repair calendar and HTTPS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Repair calendar and HTTPS'
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Deploy calendar fix, apply certificates, and smoke test
        shell: bash
        run: |
          set -euo pipefail
          API='https://pages-api.edgeone.ai/v1'
          CAL_PID='makers-fxgtk9g6t5ru'
          ZONE='zone-3ucp6ukgkx0d'
          : "${EDGEONE_API_TOKEN:?EDGEONE_API_TOKEN is missing}"

          raw_api() {
            curl -sS "$API" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
              --data-binary "$1"
          }

          api() {
            local out
            out="$(raw_api "$1")"
            echo "$out" | jq . >&2
            jq -e '(.Code == 0) and ((.Data.Response.Error? // null) == null)' >/dev/null <<<"$out"
            printf '%s' "$out"
          }

          echo '=== DEPLOY CALENDAR FIX ==='
          d="$(api "$(jq -nc --arg pid "$CAL_PID" '{Action:"CreatePagesDeployment",ProjectId:$pid,ViaMeta:"Github",Provider:"Github",Env:"Production",RepoBranch:"main"}')")"
          did="$(jq -r '.Data.Response.DeploymentId' <<<"$d")"
          for _ in $(seq 1 90); do
            sleep 4
            s="$(api "$(jq -nc --arg pid "$CAL_PID" --arg did "$did" '{Action:"DescribePagesDeployments",ProjectId:$pid,DeploymentIds:[$did],Limit:10,Offset:0}')")"
            status="$(jq -r '.Data.Response.Deployments[0].Status // "Pending"' <<<"$s")"
            echo "calendar deployment: $status"
            case "$status" in
              Success)
                echo "calendar deployed commit: $(jq -r '.Data.Response.Deployments[0].RepoCommitHash' <<<"$s")"
                break
                ;;
              Failed|Invalid|Timeout|Cancelled) exit 1 ;;
            esac
          done
          [ "$status" = 'Success' ]

          echo '=== VERIFY PRESET API BEFORE TLS ==='
          for _ in $(seq 1 20); do
            code="$(curl -sS --max-time 90 -o /tmp/preset-meta.json -w '%{http_code}' 'https://ffl-calendar-new.edgeone.dev/api/meta' || true)"
            echo "preset /api/meta HTTP=$code"
            if [ "$code" = '200' ]; then
              python - <<'PY'
          import json
          x=json.load(open('/tmp/preset-meta.json'))
          assert isinstance(x.get('airlines'), list) and x['airlines'], x
          assert isinstance(x.get('airports'), list) and x['airports'], x
          print('preset meta ok:', len(x['airlines']), 'airlines,', len(x['airports']), 'airports')
          PY
              break
            fi
            cat /tmp/preset-meta.json || true
            sleep 5
          done
          [ "$code" = '200' ]

          echo '=== APPLY EDGEONE FREE CERTIFICATES ==='
          cert="$(raw_api "$(jq -nc --arg zone "$ZONE" '{Action:"ModifyHostsCertificate",ZoneId:$zone,Hosts:["calendar.lovefly.club","ca-miles.lovefly.club"],Mode:"eofreecert"}')")"
          echo "$cert" | jq .
          jq -e '(.Code == 0) and ((.Data.Response.Error? // null) == null)' >/dev/null <<<"$cert"

          echo '=== WAIT FOR REAL TLS ==='
          ok_calendar=0
          ok_ca=0
          for n in $(seq 1 80); do
            if [ "$ok_calendar" -eq 0 ]; then
              c="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://calendar.lovefly.club/' || true)"
              echo "[$n] calendar TLS HTTP=$c"
              [ "$c" = '200' ] && ok_calendar=1 || true
            fi
            if [ "$ok_ca" -eq 0 ]; then
              c="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://ca-miles.lovefly.club/' || true)"
              echo "[$n] ca-miles TLS HTTP=$c"
              [ "$c" = '200' ] && ok_ca=1 || true
            fi
            [ "$ok_calendar" -eq 1 ] && [ "$ok_ca" -eq 1 ] && break
            sleep 15
          done
          [ "$ok_calendar" -eq 1 ]
          [ "$ok_ca" -eq 1 ]

          echo '=== FINAL CALENDAR API SMOKE ==='
          curl -fsS --max-time 90 'https://calendar.lovefly.club/api/meta' -o /tmp/meta.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/meta.json'))
          assert isinstance(x.get('airlines'), list) and x['airlines'], x
          assert isinstance(x.get('airports'), list) and x['airports'], x
          assert x.get('flight_records', 0) > 0, x
          print('calendar meta ok:', x['flight_records'], 'records,', len(x['airlines']), 'airlines')
          PY

          curl -fsS --max-time 120 'https://calendar.lovefly.club/api/routes?location=%E5%8C%97%E4%BA%AC&direction=departure&membership=666' -o /tmp/routes.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/routes.json'))
          assert isinstance(x.get('routes'), list) and x['routes'], x
          print('calendar routes ok:', len(x['routes']))
          PY

          echo '=== CERTIFICATE SUBJECTS ==='
          for domain in calendar.lovefly.club ca-miles.lovefly.club; do
            echo "--- $domain ---"
            echo | openssl s_client -connect "${domain}:443" -servername "$domain" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          done
