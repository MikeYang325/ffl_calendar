name: Inspect Pages custom domain bindings
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Inspect Pages custom domain bindings'
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Query Pages projects and domains
        shell: bash
        run: |
          set -euo pipefail
          API='https://pages-api.edgeone.ai/v1'
          : "${EDGEONE_API_TOKEN:?EDGEONE_API_TOKEN is missing}"

          raw() {
            curl -sS "$API" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
              --data-binary "$1"
          }

          projects="$(raw '{"Action":"DescribePagesProjects","Limit":100,"Offset":0}')"
          echo '=== PROJECTS ==='
          echo "$projects" | jq '.Data.Response.Projects[] | {Name,ProjectId,Provider,PresetDomain,ZoneId,CustomDomains}'

          for domain in calendar.lovefly.club ca-miles.lovefly.club; do
            pid="$(echo "$projects" | jq -r --arg d "$domain" '.Data.Response.Projects[] | select(any(.CustomDomains[]?; .Domain==$d)) | .ProjectId' | head -1)"
            echo "=== DOMAIN $domain / PROJECT $pid ==="
            if [ -z "$pid" ]; then
              echo 'PROJECT_NOT_FOUND'
              continue
            fi
            raw "$(jq -nc --arg pid "$pid" --arg d "$domain" '{Action:"DescribePagesZoneCustomDomains",ProjectId:$pid,Domain:$d}')" | jq .
          done
