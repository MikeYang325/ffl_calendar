name: Inspect calendar deployment history
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Inspect calendar deployment history'
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: List successful Calendar deployments
        shell: bash
        run: |
          set -euo pipefail
          API='https://pages-api.edgeone.ai/v1'
          : "${EDGEONE_API_TOKEN:?EDGEONE_API_TOKEN is missing}"
          curl -sS "$API" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
            --data-binary '{"Action":"DescribePagesDeployments","ProjectId":"makers-fxgtk9g6t5ru","Filters":[{"Name":"Status","Values":["Success"]}],"Limit":50,"Offset":0,"OrderBy":"ModifiedOn","OrderType":"Desc"}' \
            | jq '.Data.Response.Deployments[] | {DeploymentId,Status,ViaMeta,Env,RepoCommitHash,RepoCommitMsg,CreatedOn,ModifiedOn,UsedInProd,PreviewUrl}'
