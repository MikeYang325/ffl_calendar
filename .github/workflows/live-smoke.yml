name: Diagnose EdgeOne certificate state
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Diagnose EdgeOne certificate state'
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Query CNAME and certificate state
        shell: bash
        run: |
          set -euo pipefail
          API='https://pages-api.edgeone.ai/v1'
          ZONE='zone-3ucp6ukgkx0d'
          : "${EDGEONE_API_TOKEN:?EDGEONE_API_TOKEN is missing}"

          call() {
            curl -sS "$API" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
              --data-binary "$1" | jq .
          }

          echo '=== CNAME STATUS ==='
          call "$(jq -nc --arg zone "$ZONE" '{Action:"CheckCnameStatus",ZoneId:$zone,RecordNames:["calendar.lovefly.club","ca-miles.lovefly.club"]}')"

          echo '=== HOST CERTIFICATES ==='
          call "$(jq -nc --arg zone "$ZONE" '{Action:"DescribeHostCertificates",ZoneId:$zone,Filters:[{Name:"host",Values:["calendar.lovefly.club","ca-miles.lovefly.club"]}]}')"

          for d in calendar.lovefly.club ca-miles.lovefly.club; do
            echo "=== FREE CERT RESULT: $d ==="
            call "$(jq -nc --arg zone "$ZONE" --arg domain "$d" '{Action:"CheckFreeCertificateVerification",ZoneId:$zone,Domain:$domain}')"
          done

          echo '=== PAGES CUSTOM DOMAINS ==='
          call "$(jq -nc '{Action:"DescribePagesZoneCustomDomains",Limit:100,Offset:0}')"
