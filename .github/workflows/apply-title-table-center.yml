name: Apply title and table alignment patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_title_table_center.py'
      - '.github/workflows/apply-title-table-center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_title_table_center.py
      - name: Validate JavaScript
        run: node --check static/app.js && node --check public/static/app.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html public/index.html static/style.css public/static/style.css
          git commit -m "Remove English eyebrow and center route table"
          git rm scripts/apply_title_table_center.py .github/workflows/apply-title-table-center.yml
          git commit -m "Remove temporary title patch files"
          git push
