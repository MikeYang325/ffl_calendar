name: Switch LoveFly shell local
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='https://lovefly.club/assets/lovefly-tools.css?v=20260830-shell-1'
          new='/lovefly-tools.css?v=20260830-shell-2'
          if old not in s and new not in s:
              raise SystemExit('LoveFly shell link not found')
          p.write_text(s.replace(old,new))
          PY
          rm .github/workflows/use-local-lovefly-tools.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/use-local-lovefly-tools.yml
          git commit -m "Use local LoveFly tools shell" || exit 0
          git push