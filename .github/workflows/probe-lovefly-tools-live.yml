name: Probe LoveFly tools live
on:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production services
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Calendar API ==='
          curl -fsS --max-time 30 'https://calendar.lovefly.club/api/meta' -o /tmp/meta.json
          jq -e '.airports | length > 0' /tmp/meta.json >/dev/null
          jq -e '.airlines | length > 0' /tmp/meta.json >/dev/null
          jq '{date_min,date_max,airport_count:(.airports|length),airline_count:(.airlines|length)}' /tmp/meta.json
          curl -fsS --max-time 30 'https://calendar.lovefly.club/api/routes?direction=departure&location=PEK&membership=666' -o /tmp/routes.json
          jq -e '.routes | type == "array"' /tmp/routes.json >/dev/null
          jq '{count,selected_name}' /tmp/routes.json

          echo '=== CA Miles ==='
          curl -fsS --max-time 30 'https://ca-miles.lovefly.club/' -o /tmp/ca.html
          grep -q '凤凰知音里程计算' /tmp/ca.html
          curl -fsS --max-time 30 'https://ca-miles.lovefly.club/lovefly-tools.css' -o /tmp/ca.css
          grep -q 'CA Miles mobile header fit' /tmp/ca.css

          echo '=== 666 ==='
          curl -fsS --max-time 30 'https://666.lovefly.club/' -o /tmp/ffl.html
          grep -q '飞飞乐机票监控' /tmp/ffl.html
          curl -fsS --max-time 30 'https://666.lovefly.club/lovefly-tools.css' -o /tmp/ffl.css
          grep -q '666 mobile query fit' /tmp/ffl.css

          echo 'ALL SERVICE SMOKE CHECKS PASSED'
