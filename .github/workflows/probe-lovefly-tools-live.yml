name: Probe LoveFly tools live
on:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe HTTP and HTTPS behavior
        shell: bash
        run: |
          set -euo pipefail
          for domain in calendar.lovefly.club ca-miles.lovefly.club; do
            echo "===== $domain ====="
            echo '--- HTTP ---'
            curl -sS -I --max-time 30 "http://${domain}/" | sed -n '1,8p'
            echo '--- HTTPS ---'
            curl -fsS -I --max-time 30 "https://${domain}/" | sed -n '1,8p'
            echo '--- CERT SAN ---'
            echo | openssl s_client -connect "${domain}:443" -servername "$domain" 2>/dev/null \
              | openssl x509 -noout -subject -ext subjectAltName
          done
