name: Fix overview UI

on:
  push:
    paths:
      - '.github/workflows/fix-overview-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested UI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          # HTML：标题 + 航线总览恢复与航班搜索相同的机场选择器壳。
          for file_name in ['templates/index.html', 'public/index.html']:
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('<title>海航 PLUS 航线查询</title>', '<title>海航PLUS快捷查询</title>')
              text = text.replace('<h1>海航 PLUS · 航线搜索</h1>', '<h1>海航PLUS快捷查询</h1>')
              old = '''              <input id="overviewOrigin" list="overviewOriginOptions" placeholder="城市 / 机场 / 三字码" autocomplete="off" />\n              <datalist id="overviewOriginOptions"></datalist>'''
              new = '''              <select id="overviewOriginSelect"></select>'''
              text = replace_once(text, old, new, f'{file_name}: overview origin control')
              path.write_text(text, encoding='utf-8')

          # JS：复用原热门/字母机场选择器；航线总览额外允许“城市聚合”搜索结果。
          for file_name in ['static/app.js', 'public/static/app.js']:
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')

              old = '''function airportLabel(code) {\n  const item = airportInfo(code);\n  return item ? `${item.name} ${item.code}` : '';\n}'''
              new = '''function airportLabel(code) {\n  const item = airportInfo(code);\n  if (item) return `${item.name} ${item.code}`;\n  const city = META?.cities?.find(x => x.name === code);\n  return city ? `${city.name} ${city.codes.join('/')}` : '';\n}'''
              text = replace_once(text, old, new, f'{file_name}: airportLabel')

              text = replace_once(
                  text,
                  'function enhanceAirportSelect(selectId, placeholder) {',
                  'function enhanceAirportSelect(selectId, placeholder, allowCities=false) {',
                  f'{file_name}: picker signature',
              )

              # 选择器卡片既可承载机场，也可承载仅在总览搜索时出现的城市聚合项。
              text = text.replace('data-code="${esc(item.code)}"', 'data-value="${esc(item.value || item.code)}"')
              text = text.replace("if (first) choose(first.dataset.code);", "if (first) choose(first.dataset.value);")
              text = text.replace("if (btn) choose(btn.dataset.code);", "if (btn) choose(btn.dataset.value);")

              old = '''    if (keyword) {\n      const matched = (META.airports || []).filter(item => airportMatches(item, keyword));\n      renderTabs();\n      renderGrid(matched, `搜索结果 · ${matched.length}`, false);\n      return;\n    }'''
              new = '''    if (keyword) {\n      const matchedAirports = (META.airports || []).filter(item => airportMatches(item, keyword));\n      const normalized = keyword.trim().toUpperCase().replace(/\\s+/g, '');\n      const matchedCities = allowCities ? (META.cities || [])\n        .filter(city => [city.name, city.label, ...(city.codes || [])]\n          .some(v => String(v || '').toUpperCase().replace(/\\s+/g, '').includes(normalized)))\n        .map(city => ({\n          name: city.name,\n          code: (city.codes || []).join('/'),\n          value: city.name,\n          label: city.label,\n          aggregate: true,\n        })) : [];\n      const matched = [...matchedCities, ...matchedAirports];\n      renderTabs();\n      renderGrid(matched, `搜索结果 · ${matched.length}`, false);\n      return;\n    }'''
              text = replace_once(text, old, new, f'{file_name}: city search results')

              old = '''  const hasBeijing = (META.cities || []).some(x => x.name === '北京');\n  $('overviewOrigin').value = hasBeijing ? '北京' : (origin.value || 'PEK');\n  refreshAllAirportPickers();'''
              new = '''  const overview = $('overviewOriginSelect');\n  const hasBeijing = (META.cities || []).some(x => x.name === '北京');\n  overview.value = hasBeijing && [...overview.options].some(o => o.value === '北京')\n    ? '北京'\n    : (origin.value || 'PEK');\n  refreshAllAirportPickers();'''
              text = replace_once(text, old, new, f'{file_name}: default overview origin')

              old = '''  $('overviewOriginOptions').innerHTML = [\n    ...(META.cities || []).map(x => `<option value="${esc(x.name)}" label="${esc(x.label)}"></option>`),\n    ...(META.airports || []).map(x => `<option value="${esc(x.code)}" label="${esc(x.name)} ${esc(x.code)}"></option>`)\n  ].join('');\n  enhanceAirportSelect('originSelect', '输入出发城市 / 机场 / 三字码');\n  enhanceAirportSelect('destinationSelect', '输入到达城市 / 机场 / 三字码');'''
              new = '''  $('overviewOriginSelect').innerHTML = optionHtml(META.airports, '选择出发城市 / 机场')\n    + (META.cities || []).map(x => `<option value="${esc(x.name)}">${esc(x.label)}</option>`).join('');\n  enhanceAirportSelect('originSelect', '输入出发城市 / 机场 / 三字码');\n  enhanceAirportSelect('destinationSelect', '输入到达城市 / 机场 / 三字码');\n  enhanceAirportSelect('overviewOriginSelect', '输入出发城市 / 机场 / 三字码', true);'''
              text = replace_once(text, old, new, f'{file_name}: init overview picker')

              text = text.replace("const origin = $('overviewOrigin').value.trim() || $('originSelect').value;", "const origin = $('overviewOriginSelect').value.trim() || $('originSelect').value;")
              text = text.replace("  $('overviewOrigin').addEventListener('change', loadOverview);\n  $('overviewOrigin').addEventListener('keydown', e => { if (e.key === 'Enter') loadOverview(); });", "  $('overviewOriginSelect').addEventListener('change', loadOverview);")

              # 日历只保留“有航线 / 无航线”两种业务状态颜色。
              new_calendar = r'''function routeCalendarHtml(route) {
  const startText = route.data_start || META.date_min;
  const endText = route.data_end || META.date_max;
  const operating = new Set(route.operating_dates || []);
  const dateFlights = route.date_flights || {};
  const weekdayFilter = Number(route.weekday_filter || 0);

  const matchesWeekday = (date) => {
    if (!weekdayFilter) return true;
    const day = new Date(`${date}T00:00:00`).getDay();
    return (day === 0 ? 7 : day) === weekdayFilter;
  };

  const start = new Date(`${startText}T00:00:00`);
  const end = new Date(`${endText}T00:00:00`);
  const months = [];
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const lastMonth = new Date(end.getFullYear(), end.getMonth(), 1);

  while (cursor <= lastMonth) {
    const year = cursor.getFullYear();
    const month = cursor.getMonth() + 1;
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDay = new Date(year, month - 1, 1);
    const mondayOffset = (firstDay.getDay() + 6) % 7;
    const cells = [];

    for (let i = 0; i < mondayOffset; i++) {
      cells.push('<span class="calendar-day blank"></span>');
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const date = isoDateLocal(year, month, day);
      const inRange = date >= startText && date <= endText;
      const selectedWeekday = matchesWeekday(date);
      const isOperating = operating.has(date) && selectedWeekday;
      const flights = (dateFlights[date] || []).join(' / ');

      let cls = 'calendar-day';
      let title = '';
      if (!inRange || (weekdayFilter && !selectedWeekday)) {
        cls += ' outside';
      } else if (isOperating) {
        cls += ' route-on';
        title = `${date}：有航线${flights ? `；${flights}` : ''}`;
      } else {
        cls += ' route-off';
        title = `${date}：无航线`;
      }
      cells.push(`<span class="${cls}" title="${esc(title)}">${day}</span>`);
    }

    months.push(`
      <div class="route-calendar-month">
        <div class="calendar-month-title">${year}年${month}月</div>
        <div class="calendar-weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="calendar-days">${cells.join('')}</div>
      </div>
    `);
    cursor = new Date(year, month, 1);
  }

  return `
    <div class="route-date-panel">
      <div class="route-date-summary simple-route-legend">
        <div><span class="legend-dot route-on"></span><strong>有航线</strong></div>
        <div><span class="legend-dot route-off"></span><strong>无航线</strong></div>
      </div>
      <div class="route-calendars">${months.join('')}</div>
    </div>
  `;
}'''
              text, count = re.subn(
                  r'function routeCalendarHtml\(route\) \{.*?\n\}\n\n\nasync function loadOverview\(\) \{',
                  new_calendar + '\n\n\nasync function loadOverview() {',
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'{file_name}: calendar function replacement failed ({count})')

              old = '''        <td class="dest"><strong>${esc(x.destination_name)}</strong> <span class="tag aggregate-tag">${x.flight_records_count} 班</span><div class="sub">${esc(x.airlines.join(' / '))}</div></td>'''
              new = '''        <td class="dest"><div class="dest-title-line"><strong>${esc(x.destination_name)}</strong><span class="route-flight-count">${x.flight_records_count} 班</span></div><div class="sub">${esc(x.airlines.join(' / '))}</div></td>'''
              text = replace_once(text, old, new, f'{file_name}: flight count layout')

              path.write_text(text, encoding='utf-8')

          # CSS：修复“xx班”对齐，并只定义两种日历业务色。
          css_extra = r'''

/* 航线总览：目的地和航班记录数保持在同一行，避免小徽标掉到下一行。 */
.dest-title-line {
  display:flex;
  align-items:center;
  gap:8px;
  min-height:24px;
  white-space:nowrap;
}
.routes-table .dest .dest-title-line strong { display:inline; }
.route-flight-count {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:44px;
  height:22px;
  padding:0 8px;
  border-radius:999px;
  background:#eef5fb;
  color:#38658f;
  font-size:11px;
  font-weight:800;
  line-height:1;
}

.simple-route-legend {
  gap:18px;
  margin-bottom:14px;
  font-size:13px;
}
.legend-dot.route-on { background:#15966f; }
.legend-dot.route-off { background:#e4e9ee; border:1px solid #ced6de; }
.calendar-day.route-on {
  background:#daf4e9;
  color:#087452;
  border:1px solid #a9dfca;
  font-weight:800;
}
.calendar-day.route-off {
  background:#f0f2f4;
  color:#9ca6b1;
  border:1px solid #e1e5e9;
}
'''
          for file_name in ['static/style.css', 'public/static/style.css']:
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              marker = '/* 航线总览：目的地和航班记录数保持在同一行，避免小徽标掉到下一行。 */'
              if marker not in text:
                  text = text.rstrip() + css_extra + '\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check static/app.js
          node --check public/static/app.js

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-overview-ui.yml
          git add templates/index.html public/index.html static/app.js public/static/app.js static/style.css public/static/style.css
          git diff --cached --check
          git commit -m "Fix overview picker and simplify route calendar"
          git push
