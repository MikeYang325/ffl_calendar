name: Fix overview UI

on:
  push:
    paths:
      - '.github/workflows/fix-overview-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested UI fixes
        run: python3 scripts/fix_overview_ui.py

      - name: Validate JavaScript
        run: |
          node --check static/app.js
          node --check public/static/app.js

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit fixes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-overview-ui.yml scripts/fix_overview_ui.py
          git add templates/index.html public/index.html static/app.js public/static/app.js static/style.css public/static/style.css
          git diff --cached --check
          git commit -m "Fix overview picker and simplify route calendar"
          git push
