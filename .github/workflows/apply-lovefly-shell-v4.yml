name: Apply LoveFly shell v4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-lovefly-shell-v4.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          link='<link rel="stylesheet" href="/lovefly-tools.css?v=20260830-shell-4">\n'
          if 'lovefly-tools.css' in s:
              s=re.sub(r'\s*<link[^>]+lovefly-tools\.css[^>]*>\s*', '\n'+link, s, count=1)
          else:
              s=s.replace('</style>\n</head>', '</style>\n'+link+'</head>', 1)
          p.write_text(s)
          PY
          rm .github/workflows/apply-lovefly-shell-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/apply-lovefly-shell-v4.yml
          git commit -m "Load LoveFly shell v4"
          git push
