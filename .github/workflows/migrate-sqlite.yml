name: SQLite migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-sqlite.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build SQLite database
        run: python3 scripts/import_csv_to_sqlite.py data/flight_daily.csv data/flights.db

      - name: Apply application changes
        run: python3 scripts/apply_release_update.py

      - name: Remove production CSV
        run: rm data/flight_daily.csv

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit release
        run: |
          rm .github/workflows/migrate-sqlite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate to SQLite and add city route search"
          git push origin HEAD:main
