name: Apply flight time pairing patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_flight_time_pairs.py'
      - '.github/workflows/apply-flight-time-pairs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_flight_time_pairs.py
      - name: Validate JavaScript
        run: node --check static/app.js && node --check public/static/app.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html public/index.html static/app.js public/static/app.js static/style.css public/static/style.css
          git commit -m "Pair route flight numbers with their times"
          git rm scripts/apply_flight_time_pairs.py .github/workflows/apply-flight-time-pairs.yml
          git commit -m "Remove temporary flight pairing patch files"
          git push
