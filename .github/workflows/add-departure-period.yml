name: Add departure period filter

# rerun after regression test fix
on:
  push:
    paths:
      - '.github/workflows/add-departure-period.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/add_departure_period_filter.py

      - name: Validate JavaScript
        run: |
          node --check static/app.js
          node --check public/static/app.js

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-departure-period.yml scripts/add_departure_period_filter.py
          git add app.py templates/index.html public/index.html static/app.js public/static/app.js static/style.css public/static/style.css tests/test_calendar_status.py
          git commit -m "Add morning and evening route filters"
          git push
