name: Fix dynamic flight count

on:
  push:
    paths:
      - '.github/workflows/fix-dynamic-flight-count.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/fix_dynamic_flight_count.py

      - name: Validate JavaScript
        run: |
          node --check static/app.js
          node --check public/static/app.js

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-dynamic-flight-count.yml scripts/fix_dynamic_flight_count.py
          git add static/app.js public/static/app.js
          git commit -m "Make route flight counts follow filters"
          git push
