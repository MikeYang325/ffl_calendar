name: Compact mobile overview

on:
  push:
    paths:
      - '.github/workflows/compact-mobile-overview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile layout patch
        run: python3 scripts/compact_mobile_overview.py

      - name: Validate JavaScript
        run: |
          node --check static/app.js
          node --check public/static/app.js

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit optimized layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/compact-mobile-overview.yml scripts/compact_mobile_overview.py
          git add static/style.css public/static/style.css
          git commit -m "Compact mobile route overview layout"
          git push
