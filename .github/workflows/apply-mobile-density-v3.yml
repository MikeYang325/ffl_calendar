name: Apply mobile density optimization v3

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_mobile_density_v3.py'
      - '.github/workflows/apply-mobile-density-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_mobile_density_v3.py
      - name: Validate JavaScript
        run: node --check static/app.js && node --check public/static/app.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/style.css public/static/style.css
          git commit -m "Increase mobile flight search information density"
          git rm scripts/apply_mobile_density_v3.py .github/workflows/apply-mobile-density-v3.yml
          git commit -m "Remove temporary mobile density patch files"
          git push
