name: Optimize airport picker performance

on:
  push:
    paths:
      - '.github/workflows/optimize-picker-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply performance patch
        run: python3 scripts/optimize_picker_performance.py

      - name: Validate JavaScript
        run: |
          node --check static/app.js
          node --check public/static/app.js

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Commit optimized picker and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/optimize-picker-performance.yml scripts/optimize_picker_performance.py
          git add static/app.js public/static/app.js static/style.css public/static/style.css
          git commit -m "Optimize airport picker responsiveness"
          git push
