name: Add Hainan logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add local Hainan Airlines logo
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 'https://logotyp.us/file/hainan-airlines.svg' -o hainan-airlines-logo.svg
          grep -qi '<svg' hainan-airlines-logo.svg
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="hero-inner">\n        <div>\n          <a class="lovefly-signature"'
          new='<div class="hero-inner">\n        <div class="carrier-heading">\n          <img class="carrier-logo carrier-logo--hainan" src="/hainan-airlines-logo.svg" alt="海南航空 Hainan Airlines" />\n          <div>\n          <a class="lovefly-signature"'
          if old not in s: raise SystemExit('hero marker missing')
          s=s.replace(old,new,1)
          old2='          <h1>海航飞飞乐PLUS快速查询</h1>\n        </div>\n        <div class="data-badge"'
          new2='          <h1>海航飞飞乐PLUS快速查询</h1>\n          </div>\n        </div>\n        <div class="data-badge"'
          if old2 not in s: raise SystemExit('hero close marker missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          css=Path('lovefly-tools.css')
          c=css.read_text()
          add='''\n.carrier-heading{display:flex;align-items:center;gap:16px}.carrier-logo{display:block;flex:0 0 auto;width:auto;max-width:116px;height:34px;object-fit:contain;object-position:left center}.carrier-logo--hainan{height:40px}@media(max-width:720px){.carrier-heading{gap:10px}.carrier-logo{max-width:84px;height:28px}.carrier-logo--hainan{height:30px}}\n'''
          if '.carrier-heading{' not in c: css.write_text(c+add)
          PY
          rm .github/workflows/add-hainan-logo.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html lovefly-tools.css hainan-airlines-logo.svg .github/workflows/add-hainan-logo.yml
          git commit -m 'Show Hainan Airlines logo in calendar header'
          git push
