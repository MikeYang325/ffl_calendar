name: Deploy EdgeOne

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EDGEONE_DEPLOY_HOOK: ${{ secrets.EDGEONE_DEPLOY_HOOK }}
    steps:
      - name: Trigger EdgeOne deployment
        run: |
          if [ -z "$EDGEONE_DEPLOY_HOOK" ]; then
            echo "EDGEONE_DEPLOY_HOOK is not configured; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$EDGEONE_DEPLOY_HOOK"
