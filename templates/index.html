<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>海航飞飞乐PLUS快速查询</title>
  <link rel="icon" type="image/svg+xml" href="/lovefly-favicon.svg" />
  <link rel="stylesheet" href="/static/style.css?v=20260831-brand-lockup-2" />
  <link rel="stylesheet" href="/lovefly-tools.css?v=20260831-brand-lockup-1" />
  <style>@media(max-width:720px){.carrier-heading{display:block}.brand-lockup{width:max-content}.carrier-heading>div+div{margin-top:8px}}</style>
  <style>
    :root {
      --bg:#fff;
      --card:#fff;
      --ink:#202020;
      --muted:#7b7b7b;
      --primary:#df171d;
      --primary-dark:#b90f14;
      --accent:#df171d;
      --line:#d9d9d9;
      --soft:#f5f5f5;
      --warn:#fff4f4;
      --shadow:none;
    }

    body {
      color:var(--ink);
      background:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      font-variant-numeric:tabular-nums;
    }

    .page-shell { border-top:3px solid var(--primary); }

    .hero {
      padding:22px 32px 18px;
      color:var(--ink);
      background:#fff;
      border-bottom:1px solid #d5d5d5;
      box-shadow:none;
    }
    .hero-inner {
      max-width:1440px;
      align-items:center;
    }
    .hero h1 {
      margin:0;
      font-size:24px;
      line-height:1.15;
      letter-spacing:-.025em;
      font-weight:760;
    }
    .hero p { color:var(--muted); opacity:1; }
    .data-badge {
      padding:0;
      color:#666;
      background:transparent;
      border:0;
      border-radius:0;
      backdrop-filter:none;
      font-size:11px;
      letter-spacing:.03em;
      text-transform:uppercase;
    }

    .container {
      max-width:1440px;
      margin:0 auto 48px;
      padding:28px 32px 0;
    }

    .main-tabs {
      gap:0;
      margin:0 0 26px;
      border-bottom:1px solid #272727;
    }
    .tab {
      padding:10px 18px 11px;
      color:#777;
      background:transparent;
      border:0;
      border-bottom:2px solid transparent;
      border-radius:0;
      box-shadow:none;
      font-size:13px;
      font-weight:650;
    }
    .tab:hover { color:#222; }
    .tab.active {
      color:#1f1f1f;
      background:transparent;
      border-bottom-color:var(--primary);
      box-shadow:none;
    }

    .search-card,
    .table-card {
      background:#fff;
      border:0;
      border-radius:0;
      box-shadow:none;
    }
    .search-card {
      padding:0 0 24px;
      border-bottom:1px solid var(--line);
    }
    .route-overview-controls {
      padding:0 0 24px;
    }

    .overview-title {
      min-height:34px;
      align-items:center;
      border-bottom:1px solid #252525;
      padding-bottom:10px;
    }
    .overview-title h2,
    .section-heading h2 {
      color:#242424;
      font-size:17px;
      font-weight:760;
      letter-spacing:-.015em;
    }
    .overview-title h2 {
      border-left:4px solid var(--primary);
      padding-left:10px;
    }
    .route-count {
      color:var(--primary);
      font-size:16px;
      font-weight:760;
    }

    .segmented {
      margin-bottom:18px;
      padding:0;
      background:#fff;
      border:1px solid #d4d4d4;
      border-radius:2px;
    }
    .segmented button {
      padding:8px 20px;
      color:#777;
      background:#fff;
      border:0;
      border-radius:0;
      font-size:12px;
      font-weight:650;
    }
    .segmented button + button { border-left:1px solid #ddd; }
    .segmented button.active {
      color:#fff;
      background:var(--primary);
      box-shadow:none;
    }

    .search-grid { gap:12px; }
    .options-row { margin-top:12px; }
    .advanced-grid,
    .overview-filter-grid { margin-top:12px; }

    .field { gap:6px; }
    .field span {
      color:#767676;
      font-size:11px;
      font-weight:600;
      letter-spacing:.01em;
    }
    .field input,
    .field select,
    .airport-input,
    .airport-search {
      height:40px;
      color:#252525;
      background:#fff;
      border:1px solid #d2d2d2;
      border-radius:2px;
      box-shadow:none;
      font-size:13px;
    }
    .field input:focus,
    .field select:focus,
    .airport-input:focus,
    .airport-search:focus {
      border-color:var(--primary);
      box-shadow:0 0 0 1px var(--primary);
    }

    .airport-picker::after { color:#888; }
    .airport-dropdown {
      border:1px solid #cfcfcf;
      border-radius:2px;
      box-shadow:0 14px 34px rgba(0,0,0,.12);
    }
    .airport-modal-head,
    .airport-tabs { border-color:#e0e0e0; }
    .airport-tab {
      color:#727272;
      border-radius:0;
    }
    .airport-tab.active { color:var(--primary); }
    .airport-tab.active::after {
      height:2px;
      background:var(--primary);
    }
    .airport-city { border-radius:2px; }
    .airport-city:hover,
    .airport-city:focus {
      color:var(--primary);
      background:#fff3f3;
    }
    .airport-city:hover .airport-city-code,
    .airport-city:focus .airport-city-code { color:var(--primary); }

    .swap-btn {
      border:1px solid #d0d0d0;
      border-radius:2px;
      color:var(--primary);
      background:#fff;
      box-shadow:none;
    }
    .swap-btn:hover { border-color:var(--primary); }

    .advanced {
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid #e1e1e1;
    }
    .advanced summary {
      color:#555;
      font-size:12px;
      font-weight:650;
    }
    .advanced summary:hover { color:var(--primary); }

    .primary-btn {
      width:auto;
      min-width:138px;
      margin-top:16px;
      padding:10px 22px;
      color:#fff;
      background:var(--primary);
      border:1px solid var(--primary);
      border-radius:2px;
      box-shadow:none;
      font-size:13px;
      font-weight:700;
    }
    .primary-btn:hover {
      background:var(--primary-dark);
      border-color:var(--primary-dark);
    }
    .primary-btn.secondary { padding-left:22px; padding-right:22px; }

    .stats-grid {
      grid-template-columns:repeat(3,1fr);
      gap:0;
      margin:18px 0 22px;
      border-top:2px solid var(--primary);
      border-bottom:1px solid var(--line);
    }
    .stat {
      min-height:94px;
      padding:15px 18px;
      background:#fff;
      border:0;
      border-right:1px solid var(--line);
      border-radius:0;
      box-shadow:none;
    }
    .stat:last-child { border-right:0; }
    .stat span {
      color:#888;
      font-size:10px;
      font-weight:600;
    }
    .stat strong {
      margin-top:7px;
      color:var(--primary);
      font-size:25px;
      line-height:1;
      font-weight:780;
      letter-spacing:-.03em;
    }

    .results-section { margin-top:22px; }
    .section-heading {
      align-items:end;
      padding:0 0 9px;
      border-bottom:1px solid #2b2b2b;
    }
    .section-heading h2 {
      margin:0;
      border-left:4px solid var(--primary);
      padding-left:10px;
    }
    .section-heading p {
      margin:5px 0 0;
      color:#8a8a8a;
      font-size:11px;
    }
    .results-list { gap:0; }
    .empty-state {
      min-height:100px;
      color:#8b8b8b;
      background:#fff;
      border:0;
      border-bottom:1px solid var(--line);
      border-radius:0;
    }

    .flight-card {
      padding:17px 16px;
      background:#fff;
      border:0;
      border-bottom:1px solid var(--line);
      border-radius:0;
      box-shadow:none;
    }
    .flight-card:hover { background:#fcfcfc; }
    .flight-card-head {
      padding-bottom:10px;
      border-bottom:1px solid #e5e5e5;
    }
    .flight-summary { color:#888; }
    .tag {
      padding:3px 6px;
      color:#555;
      background:#f2f2f2;
      border-radius:2px;
      font-size:10px;
      font-weight:650;
    }
    .tag.product {
      color:var(--primary);
      background:#fff0f0;
    }
    .tag.stop {
      color:#7b5e22;
      background:#faf4e8;
    }
    .time-block strong {
      color:#222;
      font-weight:760;
    }
    .timeline { color:#888; }
    .timeline::before,
    .timeline::after { background:#cfcfcf; }
    .timeline .plane { color:var(--primary); }
    .segment-meta { color:#7d7d7d; }
    .connection {
      color:#755f35;
      background:#faf7f0;
      border-radius:2px;
    }

    .table-card {
      margin-top:16px;
      padding:0;
      border-top:1px solid #272727;
      overflow:auto;
    }
    .routes-table th {
      padding:11px 12px;
      color:#fff;
      background:#333331;
      border:0;
      font-size:10px;
      font-weight:650;
      letter-spacing:.02em;
    }
    .routes-table td {
      padding:11px 12px;
      color:#303030;
      border-top:0;
      border-bottom:1px solid #dedede;
      font-size:12px;
    }
    .routes-table tr:hover td { background:#fff7f7; }
    .routes-table .sub { color:#8b8b8b; }
    .route-flight-count {
      min-width:38px;
      height:19px;
      padding:0 6px;
      color:#555;
      background:#f0f0f0;
      border-radius:2px;
      font-size:10px;
    }
    .date-toggle-btn,
    .route-days-line .date-toggle-btn { color:var(--primary); }
    .date-toggle-btn:hover,
    .date-toggle-btn:focus-visible,
    .route-days-line .date-toggle-btn:hover {
      background:#fff0f0;
      border-radius:2px;
    }

    .date-detail-btn {
      color:var(--primary);
      background:#fff;
      border:1px solid #e0b5b7;
      border-radius:2px;
    }
    .date-detail-btn:hover { background:#fff3f3; }
    .route-date-row td { background:#fafafa !important; }
    .route-date-panel { border-top:1px solid #ddd; }
    .route-calendar-month {
      border-color:#d8d8d8;
      border-radius:2px;
    }
    .calendar-month-title { color:#2b2b2b; }
    .calendar-day { border-radius:2px; }
    .calendar-day.route-on,
    .calendar-day.operating,
    .calendar-day.b-candidate {
      color:#a90f15;
      background:#fff0f0;
      border-color:#e9b9bb;
    }
    .legend-dot.route-on,
    .legend-dot.operating,
    .legend-dot.b-candidate { background:var(--primary); }

    .roundtrip-direction-line + .roundtrip-direction-line,
    .roundtrip-direction-line .flight-time-pair + .flight-time-pair,
    .flight-time-pair + .flight-time-pair { border-color:#d8d8d8; }
    .route-dir-badge {
      color:var(--primary);
      background:#fff0f0;
      border-radius:2px;
    }
    .roundtrip-calendar-side > h4 {
      color:var(--primary);
      background:#fff6f6;
      border-color:#ddd;
    }
    .flight-pair-time { border-color:#ddd; }

    .mobile-route-calendar-overlay { background:rgba(0,0,0,.34); }
    .mobile-route-calendar-sheet {
      background:#fff;
      border-radius:4px 4px 0 0;
      box-shadow:0 -12px 34px rgba(0,0,0,.16);
    }
    .mobile-route-calendar-head {
      background:#fff;
      border-color:#ddd;
    }
    .mobile-route-calendar-close {
      color:#555;
      background:#f2f2f2;
    }

    footer {
      color:#999;
      border-top:1px solid #e1e1e1;
      font-size:10px;
    }

    @media (max-width:820px) {
      .hero {
        padding:18px 18px 15px;
      }
      .hero-inner { display:flex; }
      .hero h1 { font-size:21px; }
      .data-badge {
        margin-top:0;
        font-size:9px;
      }
      .container {
        margin-top:0;
        padding:20px 18px 0;
      }
      .main-tabs { margin-bottom:20px; }
      .search-card,
      .route-overview-controls {
        padding:0 0 18px;
        border-radius:0;
      }
      .stats-grid { grid-template-columns:repeat(3,1fr); }
      .stat { min-height:78px; padding:12px; }
      .stat strong { font-size:20px; }
    }

    @media (max-width:520px) {
      .page-shell { border-top-width:2px; }
      .hero {
        padding:14px 12px 12px;
      }
      .hero-inner {
        display:flex;
        align-items:center;
        gap:10px;
      }
      .hero h1 {
        margin:0;
        font-size:18px;
        letter-spacing:-.02em;
      }
      .data-badge {
        margin:0;
        max-width:42%;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
      }
      .container {
        padding:14px 10px 0;
        margin-top:0;
      }
      .main-tabs {
        margin-bottom:15px;
        overflow-x:auto;
      }
      .tab {
        padding:8px 12px 9px;
        border-radius:0;
        font-size:12px;
      }

      #searchPanel .search-card,
      .route-overview-controls {
        padding:0 0 14px;
        background:#fff;
        border-color:#ddd;
        border-radius:0;
        box-shadow:none;
      }
      #searchPanel .segmented {
        margin-bottom:10px;
        border-radius:2px;
      }
      #searchPanel .segmented button {
        min-height:30px;
        padding:5px 13px;
        border-radius:0;
        font-size:11px;
      }
      #searchPanel .field > span,
      .overview-filter-grid .field > span {
        color:#777;
        font-size:9px;
        font-weight:600;
      }
      #searchPanel .field input,
      #searchPanel .field select,
      #searchPanel .airport-input,
      .overview-filter-grid .field input,
      .overview-filter-grid .field select,
      .route-overview-controls .airport-input {
        height:36px;
        color:#222;
        background:#fff;
        border-color:#d4d4d4;
        border-radius:2px;
        font-size:12px;
      }
      #searchPanel .route-row .swap-btn {
        background:#fff;
        border-color:#d4d4d4;
        border-radius:2px;
        box-shadow:none;
      }
      #searchPanel .advanced {
        border-color:#ddd;
      }
      #searchPanel .advanced summary { color:#555; }
      #searchPanel .primary-btn,
      .route-overview-controls .primary-btn.secondary {
        min-height:36px;
        margin-top:10px;
        padding:8px 16px;
        background:var(--primary);
        border-radius:2px;
        box-shadow:none;
        font-size:12px;
      }

      .overview-title {
        padding-bottom:8px;
      }
      .overview-title h2 { font-size:15px; }
      .route-count { font-size:13px; }

      #searchPanel .stats-grid {
        gap:0;
        margin:12px 0 15px;
        border-color:var(--primary) #ddd #ddd;
      }
      #searchPanel .stat {
        min-height:58px;
        padding:8px 5px;
        background:#fff;
        border-radius:0;
        box-shadow:none;
      }
      #searchPanel .stat span {
        color:#888;
        font-size:8px;
      }
      #searchPanel .stat strong {
        color:var(--primary);
        font-size:16px;
      }

      #searchPanel .section-heading {
        padding:0 0 7px;
      }
      #searchPanel .section-heading h2 {
        color:#222;
        font-size:15px;
      }
      #searchPanel .section-heading p {
        color:#888;
        font-size:9px;
      }
      #searchPanel .flight-card {
        padding:10px 8px;
        background:#fff;
        border-radius:0;
        box-shadow:none;
      }
      #searchPanel .flight-card-head {
        border-color:#e5e5e5;
      }
      #searchPanel .flight-card-head > div:first-child > strong { color:#222; }
      #searchPanel .flight-summary { color:#8a8a8a; }
      #searchPanel .tag {
        color:#555;
        background:#f2f2f2;
        border-radius:2px;
      }
      #searchPanel .tag.product {
        color:var(--primary);
        background:#fff0f0;
      }
      #searchPanel .time-block strong { color:#222; }
      #searchPanel .timeline .plane { color:var(--primary); }
      #searchPanel .connection {
        background:#faf7f0;
        border-radius:2px;
      }

      .table-card { margin-top:10px; }
      .routes-table th { padding:9px 10px; }
      .routes-table td { padding:9px 10px; }
      .route-calendar-month { border-radius:2px; }
      .mobile-route-calendar-sheet { border-radius:4px 4px 0 0; }
      .mobile-route-calendar-scroll .route-calendar-month + .route-calendar-month {
        border-top-color:#f1f1f1;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-inner">
        <div class="carrier-heading">
          <div class="brand-lockup" aria-label="海南航空 × LoveFly.club"><a href="https://www.hnair.com/" target="_blank" rel="noreferrer" aria-label="海南航空官网"><img class="brand-logo brand-logo--hainan" src="/hainan-airlines-logo.svg" alt="海南航空 Hainan Airlines" /></a><span class="brand-join" aria-hidden="true">×</span><a class="lovefly-signature brand-logo--lovefly" href="https://lovefly.club/" target="_blank" rel="noreferrer" aria-label="LoveFly.club 官网"><span class="lf-love">Love</span><span class="lf-fly">Fly</span><span class="lf-dot">.</span><span class="lf-club">club</span></a></div>
          <div>
          <h1>海航飞飞乐PLUS快速查询</h1>
        </div>
        <div class="data-badge" id="dataBadge">正在读取数据…</div>
      </div>
    </header>

    <main class="container">
      <nav class="main-tabs">
        <button class="tab active" data-tab="routesPanel">航线总览</button>
        <button class="tab" data-tab="searchPanel">航班搜索</button>
      </nav>

      <section id="searchPanel" class="panel">
        <div class="search-card">
          <div class="segmented" id="tripMode">
            <button class="active" data-mode="oneway">单程</button>
            <button data-mode="roundtrip">往返</button>
          </div>

          <div class="search-grid route-row">
            <label class="field">
              <span>出发城市 / 机场</span>
              <select id="originSelect"></select>
            </label>
            <button class="swap-btn" id="swapBtn" title="交换出发和到达">⇄</button>
            <label class="field">
              <span>到达城市 / 机场</span>
              <select id="destinationSelect"></select>
            </label>
          </div>

          <div class="search-grid options-row">
            <label class="field">
              <span>出发日期</span>
              <input id="departureDate" type="date" />
            </label>
            <label class="field return-field hidden" id="returnField">
              <span>返程日期</span>
              <input id="returnDate" type="date" />
            </label>
            <label class="field">
              <span>会员版本</span>
              <select id="membershipSelect">
                <option value="666" selected>666</option>
                <option value="all">666/2666</option>
              </select>
            </label>
            <label class="field">
              <span>最大中转次数</span>
              <select id="maxStopsSelect">
                <option value="0">仅直飞</option>
                <option value="1">最多 1 次中转</option>
                <option value="2">最多 2 次中转</option>
              </select>
            </label>
          </div>

          <details class="advanced">
            <summary>高级选项</summary>
            <div class="search-grid advanced-grid">
              <label class="field">
                <span>航司</span>
                <select id="airlineSelect"><option value="">全部航司</option></select>
              </label>
              <label class="field">
                <span>航班号</span>
                <input id="flightNoInput" type="text" placeholder="例如 HU7167" />
              </label>
              <label class="field">
                <span>排序</span>
                <select id="sortSelect">
                  <option value="departure">起飞时间</option>
                  <option value="arrival">到达时间</option>
                  <option value="duration">总行程时间</option>
                  <option value="stops">中转次数</option>
                </select>
              </label>
            </div>
          </details>

          <button class="primary-btn" id="searchBtn">搜索航班</button>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <section class="results-section">
          <div class="section-heading">
            <div>
              <h2 id="resultTitle">搜索结果</h2>
              <p id="resultSubtitle">选择城市和日期后开始搜索</p>
            </div>
          </div>
          <div id="results" class="results-list empty-state">暂无搜索结果</div>
          <div id="returnResultsWrap" class="hidden">
            <div class="section-heading return-heading">
              <div>
                <h2 id="returnTitle">返程</h2>
                <p id="returnSubtitle"></p>
              </div>
            </div>
            <div id="returnResults" class="results-list"></div>
          </div>
        </section>
      </section>

      <section id="routesPanel" class="panel active">
        <div class="search-card route-overview-controls">
          <div class="overview-title">
            <div>
              <h2>航线总览</h2>
            </div>
            <div class="route-count" id="routeCount">0 条</div>
          </div>
          <div class="search-grid overview-filter-grid">
            <label class="field">
              <span>查询方向</span>
              <select id="overviewDirection">
                <option value="departure" selected>出发地</option>
                <option value="arrival">到达地</option>
                <option value="roundtrip">往返</option>
              </select>
            </label>
            <label class="field">
              <span id="overviewLocationLabel">出发城市 / 机场</span>
              <select id="overviewOriginSelect"></select>
            </label>
            <label class="field">
              <span>会员版本</span>
              <select id="overviewMembership">
                <option value="666" selected>666</option>
                <option value="2666">2666</option>
              </select>
            </label>
            <label class="field">
              <span>出发星期</span>
              <select id="overviewWeekday">
                <option value="">全部</option>
                <option value="1">周一</option>
                <option value="2">周二</option>
                <option value="3">周三</option>
                <option value="4">周四</option>
                <option value="5">周五</option>
                <option value="6">周六</option>
                <option value="7">周日</option>
              </select>
            </label>
            <label class="field">
              <span>出发时段</span>
              <select id="overviewDeparturePeriod">
                <option value="">全部时段</option>
                <option value="morning">早上出发</option>
                <option value="evening">晚上出发</option>
              </select>
            </label>
            <label class="field">
              <span>航司</span>
              <select id="overviewAirline"><option value="">全部航司</option></select>
            </label>
            <label class="field">
              <span>搜索</span>
              <input id="overviewQuery" placeholder="目的地 / 机场 / 航班号" />
            </label>
          </div>
          <button class="primary-btn secondary" id="overviewBtn">查看航线</button>
        </div>
        <div id="routesTableWrap" class="table-card">
          <table class="routes-table">
            <thead>
              <tr>
                <th id="routeCounterpartHeader">到达城市</th><th>机场</th><th>航班 / 时刻</th><th>班期</th><th>实际运行日期</th><th>产品</th>
              </tr>
            </thead>
            <tbody id="routesTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>独立航班计划查询工具 · 非实时航班服务，实际预订请以航司官方系统为准。</p>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
